name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Syntax check and regression tests
        run: npm test
      - name: Regenerate brand icon and installer license
        run: |
          npm run icon
          npm run license
      - name: Verify generated assets
        run: |
          test -s build/icon.ico
          test -s build/icon.png
          test -s build/license.txt
      - name: Verify generated assets are reproducible
        run: git diff --exit-code -- build/icon.ico build/icon.png build/license.txt
