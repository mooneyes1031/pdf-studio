name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # 海外 runner 走官方源更稳；不要强制国内镜像（容易超时）。
      # 本地打包如需镜像，在终端自行设置 ELECTRON_MIRROR 即可。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Syntax check and regression tests
        run: npm test
      - name: Build NSIS installer, portable exe and unpacked app
        run: npm run pack
        env:
          # 让打包出的 exe 里「关于 / 检查更新 / 官网链接」直接指向本仓库
          PDF_STUDIO_REPO: ${{ github.repository }}
      - name: List build output
        shell: pwsh
        run: Get-ChildItem dist -File | Select-Object Name, Length
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf-studio-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/associate.cmd
            dist/unassociate.cmd
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            dist/PDF-Studio-Setup-*.exe
            dist/PDF-Studio-*-portable.exe
            dist/associate.cmd
            dist/unassociate.cmd
          fail_on_unmatched_files: true
